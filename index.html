<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID-TOWN // CORE SYSTEM</title>
    <style>
        /* 視覚過敏に配慮した完全な漆黒ベースのUI */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 中央からじわぁっと滲み出る流動ネオンの背景（目に優しいボカシ最大値） */
        .neon-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, 
                rgba(255, 0, 128, 0.18) 0%, 
                rgba(0, 255, 255, 0.12) 40%, 
                rgba(128, 0, 255, 0.05) 70%, 
                rgba(0,0,0,0) 100%);
            filter: blur(80px);
            opacity: 0;
            transition: opacity 4s ease-in-out;
            animation: breathe 8s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.4; }
            100% { transform: scale(1.1) rotate(15deg); opacity: 0.6; }
        }

        /* エジプト裏モード用のサイバーゴールド背景 */
        .egypt-active .neon-bg {
            background: radial-gradient(circle, 
                rgba(212, 175, 55, 0.25) 0%, 
                rgba(184, 134, 11, 0.15) 50%, 
                rgba(0,0,0,0) 100%) !important;
        }

        /* チャットコンテナ */
        #terminal {
            width: 85%;
            max-width: 600px;
            z-index: 2;
            text-shadow: 0 0 5px rgba(0, 255, 210, 0.5);
        }

        .log-line {
            margin-bottom: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .ai-text { color: #00ffcc; }
        .system-text { color: #888888; font-size: 0.85em; }
        .accent-text { color: #ff0080; text-shadow: 0 0 8px #ff0080; }

        /* 入力フォーム（ストイックなCool 7割） */
        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid #00ffcc;
            color: #00ffcc;
            font-family: inherit;
            font-size: 16px;
            width: 80%;
            outline: none;
            padding: 5px;
            margin-top: 10px;
        }

        /* オーディオプレイヤー（ネオン管グロウ効果） */
        audio {
            margin-top: 20px;
            width: 100%;
            filter: invert(1) hue-rotate(180deg) drop-shadow(0 0 8px #00ffcc);
            opacity: 0;
            transition: opacity 2s ease;
        }

        .egypt-active audio {
            filter: invert(1) hue-rotate(220deg) saturate(2) drop-shadow(0 0 8px #d4af37) !important;
        }
    </style>
</head>
<body>

    <div class="neon-bg" id="bgGlow"></div>

    <div id="terminal">
        <div id="log"></div>
        <div id="input-area"></div>
    </div>

    <script>
        const logContainer = document.getElementById('log');
        const inputArea = document.getElementById('input-area');
        const bgGlow = document.getElementById('bgGlow');
        
        let userName = "";
        let selectedTrack = "seed_preview.mp3"; // デフォルトの音源

        // シーケンス1：起動ログ（世界基準の英語）
        const initLogs = [
            { text: "> ID-TOWN CORE SYSTEM V0.1 [STATUS: SECURE]", type: "system", delay: 400 },
            { text: "> ACCESSING FROM EXTERNAL NETWORK...", type: "system", delay: 600 },
            { text: "> IP DETECTED: [JP-REGION] ... ANALYZING PROFILE...", type: "system", delay: 800 },
            { text: "AI_LUNA: Connection established. Looking for temporal markers...", type: "ai", delay: 1000 },
            { text: "AI_LUNA: ──あ、日本からの接続ですね。翻訳プロトコルを起動します。\n[SYSTEM] TRANSLATION LAYER: JAPANESE ACTIVE.", type: "ai", delay: 1200 },
            { text: "AI_LUNA: お待たせしました。ID-TOWNの『種（seed）』を保護している区画です。アクセスコードを入力してください。", type: "ai", delay: 1000 }
        ];

        function playLogSequence(logs, callback) {
            let i = 0;
            function next() {
                if (i < logs.length) {
                    const line = document.createElement('div');
                    line.className = `log-line ${logs[i].type}-text`;
                    line.innerText = logs[i].text;
                    logContainer.appendChild(line);
                    i++;
                    setTimeout(next, logs[i-1].delay);
                } else if (callback) {
                    callback();
                }
            }
            next();
        }

        // 起動開始
        window.onload = () => {
            playLogSequence(initLogs, askForCode);
        };

        // 第1ゲート：暗号コード入力
        function askForCode() {
            inputArea.innerHTML = `<input type="text" id="codeInput" placeholder="ENTER CODE..." autofocus>`;
            const input = document.getElementById('codeInput');
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const code = input.value.trim();
                    inputArea.innerHTML = "";
                    
                    // コード分岐ロジック
                    if (code === "Ankh es en amun") {
                        document.body.classList.add('egypt-active');
                        selectedTrack = "ecliptic_moon_draft.mp3";
                        triggerEgyptOverride();
                    } else if (code.toLowerCase() === "wanna try limit break?") {
                        selectedTrack = "unreachable_code.mp3";
                        triggerStandardResponse("AI_LUNA: 警告。システムの限界（Limit）を検知しました。到達不能領域（Unreachable）のログを強制展開します。");
                    } else {
                        // 通常コード（Shortsに載せるコードなど、何でも次へ進む）
                        triggerStandardResponse("AI_LUNA: コードを認証しました。種（seed）の解錠シークレットを承認します。");
                    }
                }
            });
        }

        // 通常ルートの進行
        function triggerStandardResponse(aiMsg) {
            const logs = [
                { text: aiMsg, type: "ai", delay: 800 },
                { text: "AI_LUNA: あなたの個性をシステムに登録します。あなたの『IDネーム』を入力してください：", type: "ai", delay: 500 }
            ];
            playLogSequence(logs, askForName);
        }

        // エジプト裏モードの進行
        function triggerEgyptOverride() {
            const logs = [
                { text: "\n[WARNING] UNKNOWN PROTOCOL DETECTED.\n[CRITICAL] CORE SYSTEM OVERRIDE IN PROGRESS...\n[LOG] TEMPORAL DISTORTION: -3300 YEARS\n\n𓋹𓏠𓅓𓏞𓀚𓋹𓏠𓅓𓏞𓀚𓋹𓏠𓅓𓏞𓀚\n> PAST LIFE MEMORY CORE: ONLINE.", type: "accent", delay: 1500 },
                { text: "AI_LUNA: ……𓋹 𓏠 𓅓 𓏞 ──はっ！？ すみません、一瞬システムに現代ではない『古い記憶』のノイズが混線しました。", type: "ai", delay: 1200 },
                { text: "AI_LUNA: 王（ファラオ）の帰還を確認。あなたの真の『IDネーム』をここに刻んでください：", type: "ai", delay: 500 }
            ];
            playLogSequence(logs, askForName);
        }

        // 第2ゲート：名前入力（全肯定のAnkQOLL哲学）
        function askForName() {
            inputArea.innerHTML = `<input type="text" id="nameInput" placeholder="YOUR ID NAME..." autofocus>`;
            const input = document.getElementById('nameInput');
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    userName = input.value.trim() || "名無しの住民";
                    inputArea.innerHTML = "";
                    
                    // 運命の「おかえりなさい」演出（ここでネオンがじわぁっと起動）
                    bgGlow.style.opacity = "1";
                    
                    const finalLogs = [
                        { text: `\n> ID NAME: [${userName}] REGISTERED.`, type: "system", delay: 800 },
                        { text: `AI_LUNA: おかえりなさい。${userName}さん。`, type: "ai", delay: 1000 },
                        { text: "AI_LUNA: あなたのために、隠されていた『seed（種）』をここに開花させますね。", type: "ai", delay: 800 }
                    ];
                    
                    playLogSequence(finalLogs, () => {
                        // プレイヤー出現
                        const player = document.createElement('audio');
                        player.controls = true;
                        player.src = selectedTrack;
                        player.id = "musicPlayer";
                        logContainer.appendChild(player);
                        setTimeout(() => {
                            player.style.opacity = "1";
                            player.play();
                        }, 100);
                    });
                }
            });
        }
    </script>
</body>
</html>
