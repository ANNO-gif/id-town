<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID-TOWN // CORE SYSTEM v0.1.3</title>
    <style>
        /* 視覚過敏に配慮した完全な漆黒ベースのUI */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        /* 中央からじわぁっと滲み出る流動ネオンの背景 */
        .neon-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, 
                rgba(255, 0, 128, 0.18) 0%, 
                rgba(0, 255, 255, 0.12) 35%, 
                rgba(128, 0, 255, 0.08) 60%, 
                rgba(0,0,0,0) 100%);
            filter: blur(100px);
            opacity: 0;
            transition: opacity 5s ease-in-out;
            animation: breathe 12s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(0.9) rotate(0deg); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); opacity: 0.6; }
        }

        .egypt-active .neon-bg {
            background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(184, 134, 11, 0.15) 50%, rgba(0,0,0,0) 100%) !important;
        }

        #terminal {
            width: 90%;
            max-width: 550px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 【修正】初期状態はステルス（非表示）にし、プレイヤーと同時にフェードイン --- */
        #logo-container {
            width: 220px;
            height: 220px;
            margin-bottom: 25px;
            position: relative;
            opacity: 0; /* 最初は完全に隠す */
            transition: opacity 3s ease-in-out; /* 3秒かけてじわぁっと降臨 */
        }

        #logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            animation: logoPulse 4s infinite alternate ease-in-out;
        }

        @keyframes logoPulse {
            0% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.15); opacity: 0.7; }
            100% { box-shadow: 0 0 30px rgba(255, 0, 127, 0.3); opacity: 0.9; }
        }

        /* 音のノイズと同期するグリッチ（バグ）エフェクト */
        .glitch-active #logo-img {
            animation: cyberGlitch 0.15s infinite linear !important;
            filter: grayscale(1) brightness(1.5) contrast(1.2);
        }

        @keyframes cyberGlitch {
            0% { transform: translate(2px, 1px) skewX(5deg); opacity: 0.9; }
            20% { transform: translate(-1px, -2px) skewX(-10deg); opacity: 0.8; }
            40% { transform: translate(3px, -1px) skewY(5deg); opacity: 1; }
            60% { transform: translate(-2px, 2px) skewX(15deg); opacity: 0.7; }
            80% { transform: translate(1px, -1px) skewY(-5deg); opacity: 0.9; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        #log-window {
            width: 100%;
        }

        .log-line {
            margin-bottom: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .ai-text { color: #00ffff; text-shadow: 0 0 5px rgba(0, 255, 255, 0.4); }
        .system-text { color: #888888; font-size: 0.9em; }
        .accent-text { color: #ff007f; text-shadow: 0 0 8px rgba(255, 0, 127, 0.7); }

        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid #ff007f;
            color: #ff007f;
            font-family: inherit;
            font-size: 18px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            padding: 5px;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }

        /* カスタムプレイヤー */
        #custom-player {
            margin-top: 25px;
            width: 100%;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 3s ease;
            border: 1px solid rgba(128, 0, 255, 0.25);
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.6);
        }

        #play-pause {
            background: transparent;
            border: none;
            color: #ff007f;
            font-size: 22px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8);
            margin-right: 15px;
        }

        #seek-bar-container {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        #seek-fill {
            height: 100%;
            background: linear-gradient(to right, #00ffff, #ff007f);
            width: 0%;
            border-radius: 2px;
        }

        #current-time {
            color: #ff007f;
            font-size: 13px;
            margin-left: 15px;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }
    </style>
</head>
<body>

    <div class="neon-bg" id="bgGlow"></div>

    <div id="terminal">
        <div id="logo-container">
            <img src="logo.png" id="logo-img" alt="AnkQOLL Logo">
        </div>

        <div id="log-window">
            <div id="log"></div>
            <div id="input-area"></div>
        </div>
        
        <div id="custom-player">
            <button id="play-pause">▶</button>
            <div id="seek-bar-container"><div id="seek-fill"></div></div>
            <div id="current-time">0:00 / 0:00</div>
        </div>
    </div>

    <audio id="musicPlayer" preload="auto"></audio>

    <script>
        const logContainer = document.getElementById('log');
        const inputArea = document.getElementById('input-area');
        const bgGlow = document.getElementById('bgGlow');
        const customPlayer = document.getElementById('custom-player');
        const logoContainer = document.getElementById('logo-container');
        const audio = document.getElementById('musicPlayer');
        const playBtn = document.getElementById('play-pause');
        const seekFill = document.getElementById('seek-fill');
        const seekBarContainer = document.getElementById('seek-bar-container');
        const currentTime = document.getElementById('current-time');
        
        let userName = "";
        let selectedTrack = "seed_preview.mp3";

        // シーケンス1：起動ログ
        const initLogs = [
            { text: "> ID-TOWN CORE SYSTEM V0.1.3 [STATUS: SECURE]", type: "system", delay: 400 },
            { text: "> ACCESSING FROM EXTERNAL NETWORK...", type: "system", delay: 500 },
            { text: "> IP DETECTED: [JP-REGION] ... ANALYZING PROFILE...", type: "system", delay: 600 },
            { text: "AI_LUNA: Connection established. Looking for temporal markers...", type: "ai", delay: 900 },
            { text: "AI_LUNA: ──あ、日本からの接続ですね。<span class='accent-text'>翻訳プロトコルを起動します。</span>\n[SYSTEM] TRANSLATION LAYER: JAPANESE ACTIVE.", type: "ai", delay: 1000 },
            { text: "AI_LUNA: お待たせしました。ID-TOWNの『種（seed）』を保護している区画です。アクセスコードを入力してください。", type: "ai", delay: 800 }
        ];

        function playLogSequence(logs, callback) {
            let i = 0;
            function next() {
                if (i < logs.length) {
                    const line = document.createElement('div');
                    line.className = `log-line ${logs[i].type}-text`;
                    line.innerHTML = logs[i].text;
                    logContainer.appendChild(line);
                    i++;
                    window.scrollTo(0, document.body.scrollHeight);
                    setTimeout(next, logs[i-1].delay);
                } else if (callback) {
                    callback();
                }
            }
            next();
        }

        window.onload = () => { playLogSequence(initLogs, askForCode); };

        function askForCode() {
            inputArea.innerHTML = `<input type="text" id="codeInput" placeholder="ENTER CODE..." autofocus>`;
            const input = document.getElementById('codeInput');
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const code = input.value.trim();
                    inputArea.innerHTML = "";
                    if (code === "Ankh es en amun") {
                        document.body.classList.add('egypt-active');
                        selectedTrack = "ecliptic_moon_draft.mp3";
                        triggerEgyptOverride();
                    } else if (code.toLowerCase() === "wanna try limit break?") {
                        selectedTrack = "unreachable_code.mp3";
                        triggerStandardResponse("AI_LUNA: 警告。<span class='accent-text'>システムの限界（Limit）を検知しました。</span>到達不能領域（Unreachable）のログを強制展開します。");
                    } else {
                        triggerStandardResponse("AI_LUNA: コードを認証しました。種（seed）の解錠シークレットを承認します。");
                    }
                }
            });
        }

        function triggerStandardResponse(aiMsg) {
            const logs = [
                { text: aiMsg, type: "ai", delay: 800 },
                { text: "AI_LUNA: あなたの個性をシステムに登録します。あなたの『IDネーム』を入力してください：", type: "ai", delay: 500 }
            ];
            playLogSequence(logs, askForName);
        }

        function triggerEgyptOverride() {
            const logs = [
                { text: "\n<span class='accent-text'>[WARNING] UNKNOWN PROTOCOL DETECTED.\n[CRITICAL] CORE SYSTEM OVERRIDE IN PROGRESS...\n[LOG] TEMPORAL DISTORTION: -3300 YEARS\n\n𓋹𓏠𓅓𓏞𓀚𓋹𓏠𓅓𓏞𓀚𓋹𓏠𓅓𓏞𓀚\n> PAST LIFE MEMORY CORE: ONLINE.</span>", type: "system", delay: 1200 },
                { text: "AI_LUNA: ……𓋹 𓏠 𓅓 𓏞 ──はっ！？ すみません、一瞬システムに現代ではない『古い記憶』のノイズが混線しました。", type: "ai", delay: 1000 },
                { text: "AI_LUNA: 王（ファラオ）の帰還を確認。あなたの真の『IDネーム』をここに刻んでください：", type: "ai", delay: 500 }
            ];
            playLogSequence(logs, askForName);
        }

        function askForName() {
            inputArea.innerHTML = `<input type="text" id="nameInput" placeholder="YOUR ID NAME..." autofocus>`;
            const input = document.getElementById('nameInput');
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    userName = input.value.trim() || "名無しの住民";
                    inputArea.innerHTML = "";
                    const finalLogs = [
                        { text: `\n> ID NAME: [${userName}] REGISTERED.`, type: "system", delay: 600 },
                        { text: `AI_LUNA: <span class='accent-text'>おかえりなさい。${userName}さん。</span>`, type: "ai", delay: 800 },
                        { text: "AI_LUNA: あなたのために、隠されていた『seed（種）』をここに<span class='accent-text'>開花させますね。</span>", type: "600" }
                    ];
                    playLogSequence(finalLogs, initAudioPlayer);
                }
            });
        }

        // --- 制御コア ---
        // --- ⚙️ 超高精度・爆速同期エンジン（60fpsループ） ---
        function initAudioPlayer() {
            audio.src = selectedTrack;
            
            bgGlow.style.opacity = "1";
            customPlayer.style.opacity = "1";
            logoContainer.style.opacity = "1";

            audio.addEventListener('loadedmetadata', () => {
                updateTimeDisplay();
                audio.play();
                playBtn.innerText = "||";
            });

            // 🧠 1秒間に60回、ミリ秒単位で時間を監視するループ関数
            function syncEngine() {
                if (audio.paused || audio.ended) {
                    logoContainer.classList.remove('glitch-active');
                    return; // 再生が止まったら監視もストップ
                }

                const time = audio.currentTime;
                
                // シークバーと時間の更新も60fpsで超ヌルヌルに
                const percent = (time / audio.duration) * 100;
                seekFill.style.width = `${percent}%`;
                updateTimeDisplay();

                // ▽▽▽ 【超高精度】ここにLogicで測ったミリ秒を指定してください！ ▽▽▽
                // 1秒間に60回チェックするので、0.1秒単位の細かいグリッチも絶対に逃しません。
                if (
                    (time >= 4.08 && time <= 4.40) ||  
                    (time >= 5.60 && time <= 6.3) ||  
                    (time >= 7.40 && time <= 7.72) ||   
                    (time >= 10.90 && time <= 11.38) || 
                    (time >= 14.10 && time <= 14.59)      
                ) {
                    logoContainer.classList.add('glitch-active');
                } else {
                    logoContainer.classList.remove('glitch-active');
                }

                // 次のフレーム（約16ミリ秒後）に自分自身を再実行
                requestAnimationFrame(syncEngine);
            }

            // 再生が始まったら爆速同期エンジンを起動
            audio.addEventListener('play', () => { 
                playBtn.innerText = "||"; 
                requestAnimationFrame(syncEngine); 
            });
            
            audio.addEventListener('pause', () => { playBtn.innerText = "▶"; });
            audio.addEventListener('ended', () => {
                playBtn.innerText = "▶";
                seekFill.style.width = "0%";
                logoContainer.classList.remove('glitch-active');
                updateTimeDisplay();
            });

            playBtn.addEventListener('click', () => {
                if (audio.paused) { audio.play(); } else { audio.pause(); }
            });

            seekBarContainer.addEventListener('click', (e) => {
                const rect = seekBarContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pos * audio.duration;
                // シーク（飛ばした）瞬間の時間でも即座に画面を更新
                updateTimeDisplay();
            });

            function updateTimeDisplay() {
                const curM = Math.floor(audio.currentTime / 60);
                const curS = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                const durM = Math.floor(audio.duration / 60) || 0;
                const durS = Math.floor(audio.duration % 60).toString().padStart(2, '0') || "00";
                currentTime.innerText = `${curM}:${curS} / ${durM}:${durS}`;
            }
        }
        // 🎧 耳でタイミングを捉えるためのDJデバッグカウンター
        window.addEventListener('keydown', (e) => {
            if (e.key === 's' || e.key === 'S') {
                console.log(`【ノイズ位置】: ${audio.currentTime.toFixed(2)} 秒`);
                // 画面にも一時的に表示させたい場合は、チャットログに流し込む
                const debugLine = document.createElement('div');
                debugLine.className = 'log-line system-text';
                debugLine.innerText = `>> DEBUG TIMING: [ ${audio.currentTime.toFixed(2)} ] SEC`;
                logContainer.appendChild(debugLine);
            }
        });
    </script>
</body>
</html>
